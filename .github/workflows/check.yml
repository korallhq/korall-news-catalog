name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Dependencies
        run: pip install PyYAML==6.0.3
      - name: Rules, version and new feeds
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:catalog.yml" > /tmp/base.yml
          python scripts/check.py --base /tmp/base.yml
      # On main the OPML export is regenerated and committed when it changed.
      - name: Rules and OPML export
        if: github.event_name == 'push'
        run: python scripts/check.py --opml catalog.opml
      - name: Commit the OPML export
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain catalog.opml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog.opml
            git commit -m "Update catalog.opml"
            git push
          fi
