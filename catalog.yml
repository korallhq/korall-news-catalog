# Source catalogue for korall: seed of an empty library, sources to pick in the library and the
# catalogue update offered to existing installations. Descriptions are written in German.
# Each source needs title and url (RSS or Atom feed); website and description are optional.
#
# Updates: raise `version` and date every change, so installations only see what is new to them.
#   added: YYYY-MM-DD     on a new source (offered unselected, never forced)
#   replaces: <old url>   when a feed moved (the source keeps its ID, selections and direct use)
#   removed:              list of {url, title, removed: YYYY-MM-DD, reason} for dead sources
