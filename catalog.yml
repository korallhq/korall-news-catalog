# Source catalogue for korall: seed of an empty library, sources to pick in the library and the
# catalogue update offered to existing installations. Descriptions are written in German.
# Each source needs title and url (RSS or Atom feed); website and description are optional.
#
# Updates: raise `version` and date every change, so installations only see what is new to them.
#   added: YYYY-MM-DD     on a new source (a further change the same day: YYYY-MM-DD.2, .3, …) (offered unselected, never forced)
#   replaces: <old url>   when a feed moved (the source keeps its ID, selections and direct use)
#   removed:              list of {url, title, removed: YYYY-MM-DD, reason} for dead sources
version: '2026-10-13'
folders:
- title: Nachrichten
  sources:
  - title: BBC World
    publisher_type: public
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    website: https://www.bbc.co.uk/
    description: Nachrichtenportal der britischen BBC mit internationalen Meldungen zu Politik, Gesellschaft, Sport
      und Wissenschaft, überwiegend auf Englisch.
  - title: Deutsche Welle
    publisher_type: public
    url: https://rss.dw.com/xml/rss-de-all
    website: https://www.dw.com/de/
    description: Deutschsprachige Nachrichten der Deutschen Welle mit internationalem Blick auf Politik, Wirtschaft
      und Gesellschaft.
